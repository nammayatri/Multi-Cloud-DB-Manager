---
# Dual Database Manager - Backend Deployment
# Node.js/Express API server with database connection pooling
#
# Configuration:
# - Replace <NAMESPACE> with your Kubernetes namespace (default: default)
# - Replace <IMAGE_REGISTRY>/dual-db-backend:<TAG> with your container image
# - Replace <FRONTEND_URL> with your frontend service URL
# - Replace <REDIS_HOST> with your Redis service hostname
# - Replace <CONFIG_SYNC_S3_SERVICE_ACCOUNT> with a ServiceAccount that has S3 access
# - Replace <CONFIG_SYNC_ALLOWED_ENVS> with the ONE env THIS deployment may Export/Patch

apiVersion: apps/v1
kind: Deployment
metadata:
  name: dual-db-backend
  namespace: <NAMESPACE>  # Replace with your namespace (e.g., default, production)
  labels:
    app: dual-db-backend
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: dual-db-backend
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: dual-db-backend
    spec:
      # Init container: clones the NammaYatri repo for migration verification
      # Remove this block if you don't use the Migration Verifier feature
      initContainers:
      - name: clone-repo
        image: alpine/git:latest
        command:
        - /bin/sh
        - -c
        - |
          if [ -d /repos/nammayatri/.git ]; then
            echo "Repo exists, fetching latest..."
            cd /repos/nammayatri && git fetch --all --prune
          else
            echo "Cloning repo..."
            git clone https://github.com/nammayatri/nammayatri.git /repos/nammayatri
          fi
        volumeMounts:
        - name: repo-volume
          mountPath: /repos
      containers:
      - name: backend
        image: <IMAGE_REGISTRY>/dual-db-backend:<TAG>  # Replace with your container image (e.g., docker.io/yourorg/dual-db-backend:v1.0.0)
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP

        # Load all secrets as environment variables
        envFrom:
        - secretRef:
            name: dual-db-secrets

        # Additional configuration
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: FRONTEND_URL
          value: "<FRONTEND_URL>"  # Replace with your frontend URL (e.g., http://localhost:5173 for dev, or your production URL)
        - name: REDIS_HOST
          value: "<REDIS_HOST>"  # Replace with your Redis host (e.g., redis-service.default.svc.cluster.local or localhost)
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_CLUSTER_MODE
          value: "false"  # Set to "true" if using Redis Cluster (e.g., AWS ElastiCache cluster mode)
        - name: RUN_MIGRATIONS
          value: "false"  # Set to "true" on first deploy to auto-create tables (users, history)
        - name: CONFIG_SYNC_ALLOWED_ENVS
          value: "<CONFIG_SYNC_ALLOWED_ENVS>"  # Exactly ONE env THIS deployment may Export/Patch, e.g. "master" or "prod" — must match the deployment's own network/creds. 'local' is always implicitly included. Leave unset only for local/dev.
        - name: CONFIG_SYNC_S3_BUCKET
          value: "<CONFIG_SYNC_S3_BUCKET>"  # S3 bucket Config Sync publishes patched config + metadata.json to. Required for any run with S3 publish enabled.

        # Optional tuning (defaults shown)
        - name: SESSION_TTL_SECONDS
          value: "43200"  # Session cookie lifetime (default: 12 hours)
        - name: REDIS_EXECUTION_TTL_SECONDS
          value: "300"  # TTL for query execution state in Redis (default: 5 minutes)
        - name: MAX_QUERY_TIMEOUT_MS
          value: "30000"  # Maximum total query timeout (default: 30 seconds)
        - name: STATEMENT_TIMEOUT_MS
          value: "30000"  # Per-statement PostgreSQL timeout (default: 30 seconds)
        - name: IDLE_IN_TRANSACTION_TIMEOUT_MS
          value: "30000"  # Kill idle transactions holding locks (default: 30 seconds)

        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi

        livenessProbe:
          httpGet:
            path: /health
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3

        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        # Volume mount for migration repo (remove if not using Migration Verifier)
        volumeMounts:
        - name: repo-volume
          mountPath: /repos

      volumes:
      - name: repo-volume
        emptyDir:
          sizeLimit: 5Gi
      # ServiceAccount with S3 access for Config Sync — mechanism differs per
      # cloud (GKE Workload Identity vs EKS IRSA), so no keys live in this file.
      serviceAccountName: <CONFIG_SYNC_S3_SERVICE_ACCOUNT>
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: dual-db-backend
  namespace: <NAMESPACE>  # Replace with your namespace
  labels:
    app: dual-db-backend
spec:
  type: ClusterIP
  selector:
    app: dual-db-backend
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
